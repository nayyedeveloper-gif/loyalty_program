<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="29 Gold & Jewellery membership and loyalty club" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="29 Gold" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="29 Gold" />
    <link rel="icon" type="image/png" href="/brand/29-logo.png" />
    <link rel="apple-touch-icon" href="/brand/29-logo.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#3b82f6" />
    <title>29 Gold & Jewellery — Membership</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var preference = (saved === 'dark' || saved === 'light' || saved === 'system') ? saved : 'system'
          var theme = preference === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.themePreference = preference
          document.documentElement.style.colorScheme = theme
          var standalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true
          if (standalone) document.documentElement.classList.add('standalone-app')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
