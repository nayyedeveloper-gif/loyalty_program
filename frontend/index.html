<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="29 Gold & Jewellery membership and loyalty club" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="29 Gold" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="29 Gold" />
    <link rel="icon" type="image/png" href="/brand/29-logo.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#3b82f6" />
    <title>29 Gold & Jewellery — Membership</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var preference = (saved === 'dark' || saved === 'light' || saved === 'system') ? saved : 'system'
          var theme = preference === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.themePreference = preference
          document.documentElement.style.colorScheme = theme
          var standalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true
          if (standalone) document.documentElement.classList.add('standalone-app')

          // Remove Vite-dev service workers only (they blank home-screen / standalone opens).
          if ('serviceWorker' in navigator) {
            var viteDev = location.port === '5173'
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                var url = (reg.active && reg.active.scriptURL)
                  || (reg.installing && reg.installing.scriptURL)
                  || (reg.waiting && reg.waiting.scriptURL)
                  || ''
                if (viteDev || url.indexOf('dev-sw') !== -1 || url.indexOf('dev-dist') !== -1) {
                  reg.unregister()
                }
              })
            }).catch(function () {})
            if (viteDev && 'caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (key) { caches.delete(key) })
              }).catch(function () {})
            }
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="app-boot" style="min-height:100dvh;display:grid;place-items:center;padding:1.5rem;font-family:system-ui,sans-serif;color:#6b7280;background:#f8fafc;text-align:center">
        <div>
          <strong style="display:block;color:#111827;font-size:1.05rem;margin-bottom:0.35rem">29 Gold</strong>
          <span>Loading membership…</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        window.setTimeout(function () {
          var boot = document.getElementById('app-boot')
          if (!boot || boot.getAttribute('data-ready') === '1') return
          boot.innerHTML = '<div><strong style="display:block;color:#111827;font-size:1.05rem;margin-bottom:0.5rem">29 Gold</strong><p style="margin:0 0 1rem;max-width:18rem;line-height:1.45">Couldn’t start the app. Check Wi‑Fi, then try again.</p><button type="button" onclick="location.reload()" style="border:0;border-radius:8px;background:#3b82f6;color:#fff;padding:0.65rem 1rem;font-weight:600">Retry</button></div>'
        }, 12000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
